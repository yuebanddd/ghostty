name: GTTY Release

on:
  push:
    tags:
      - gtty-v*
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version used for the dry-run installers
        required: true
        default: 0.1.0-dev.0
        type: string

permissions:
  contents: read

concurrency:
  group: gtty-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.16.0

jobs:
  policy:
    name: Release policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      deb_version: ${{ steps.release.outputs.deb_version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check out GTTY
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate GTTY workflow ownership
        run: bash scripts/ci/validate-workflows.sh
      - name: Validate release helpers
        run: bash scripts/release/test-resolve-version.sh
      - id: release
        name: Resolve release mode and version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            bash scripts/release/resolve-version.sh "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"

            git fetch --no-tags origin release:refs/remotes/origin/release
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/release; then
              echo "Release tags must point to a commit contained in release." >&2
              exit 1
            fi
          else
            if [[ "${GITHUB_REF_NAME}" != "release" ]]; then
              echo "Manual release dry runs must use the release branch." >&2
              exit 1
            fi

            bash scripts/release/resolve-version.sh "gtty-v${MANUAL_VERSION#gtty-v}" \
              >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch builds complete installers without creating a GitHub Release."
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out GTTY
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            dpkg-dev \
            gettext \
            libadwaita-1-dev \
            libgtk-4-dev \
            libxml2-utils \
            pkg-config
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build Linux application
        shell: bash
        env:
          GTTY_VERSION: ${{ needs.policy.outputs.version }}
        run: |
          install_root="${RUNNER_TEMP}/gtty-install-root"
          echo "GTTY_INSTALL_ROOT=$install_root" >> "$GITHUB_ENV"

          zig build \
            --prefix "$install_root/usr" \
            -Doptimize=ReleaseFast \
            -Dversion-string="$GTTY_VERSION" \
            -fno-sys=gtk4-layer-shell
          cargo build --locked --release -p gttyd
      - name: Build installable Debian package
        shell: bash
        env:
          GTTY_VERSION: ${{ needs.policy.outputs.version }}
          GTTY_DEB_VERSION: ${{ needs.policy.outputs.deb_version }}
        run: |
          bash scripts/release/package-linux-deb.sh \
            "$GTTY_VERSION" \
            "$GTTY_DEB_VERSION" \
            "${{ matrix.deb_arch }}" \
            "$GTTY_INSTALL_ROOT" \
            target/release/gttyd \
            dist
      - name: Verify Debian installation
        shell: bash
        run: |
          package="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          sudo apt-get install --yes "$package"
          command -v gtty
          command -v ghostty
          command -v gttyd
          gtty --version
          gttyd --help
      - name: Upload Linux installer
        uses: actions/upload-artifact@v6
        with:
          name: gtty-release-linux-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out GTTY
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build macOS application
        shell: bash
        env:
          GTTY_VERSION: ${{ needs.policy.outputs.version }}
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Dversion-string="$GTTY_VERSION"
          cargo build --locked --release -p gttyd
      - name: Build installable macOS disk image
        shell: bash
        env:
          GTTY_VERSION: ${{ needs.policy.outputs.version }}
        run: |
          bash scripts/release/package-macos-dmg.sh \
            "$GTTY_VERSION" \
            "${{ matrix.arch }}" \
            zig-out/Ghostty.app \
            target/release/gttyd \
            dist
      - name: Upload macOS installer
        uses: actions/upload-artifact@v6
        with:
          name: gtty-release-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish unsigned preview
    if: needs.policy.outputs.publish == 'true'
    needs:
      - policy
      - linux
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@v8
        with:
          pattern: gtty-release-*
          path: dist
          merge-multiple: true
      - name: Validate release asset set
        shell: bash
        env:
          GTTY_VERSION: ${{ needs.policy.outputs.version }}
        run: |
          bash scripts/release/verify-release-assets.sh "$GTTY_VERSION" dist
      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GTTY prerelease
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: GTTY ${{ github.ref_name }} (unsigned preview)
          body: |
            This release contains directly installable, unsigned GTTY preview builds.

            macOS:
            1. Download the `.dmg` matching your Mac.
            2. Open it and drag `GTTY.app` to `Applications`.
            3. Because this preview is not notarized, use Control-click → Open on first launch.

            Ubuntu 24.04 or compatible Debian-based Linux:
            `sudo apt install ./gtty_${{ needs.policy.outputs.version }}_amd64.deb`
            (use the `arm64` file on ARM machines).

            The package includes the terminal application, the `gtty` command,
            and the `gttyd` local daemon. It replaces an installed `ghostty`
            Debian package because both provide the same terminal resources.
            Verify every download with `SHA256SUMS`.
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
          make_latest: false
