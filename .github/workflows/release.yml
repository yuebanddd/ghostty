name: GTTY Release

on:
  pull_request:
    branches:
      - release
  push:
    tags:
      - gtty-v*
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version used for the dry-run installers
        required: true
        default: 0.1.0-dev.0
        type: string

permissions:
  contents: read

concurrency:
  group: gtty-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.16.0

jobs:
  policy:
    name: Release policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      deb_version: ${{ steps.release.outputs.deb_version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check out GTTY
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate GTTY workflow ownership
        run: bash scripts/ci/validate-workflows.sh
      - name: Validate release helpers
        run: bash scripts/release/test-resolve-version.sh
      - id: release
        name: Resolve release mode and version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            bash scripts/release/resolve-version.sh "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"

            git fetch --no-tags origin release:refs/remotes/origin/release
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/release; then
              echo "Release tags must point to a commit contained in release." >&2
              exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            bash scripts/release/resolve-version.sh "gtty-v0.0.0-pr.${PR_NUMBER}" \
              >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Pull requests build and verify installers without publishing."
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "release" ]]; then
              echo "Manual release dry runs must use the release branch." >&2
              exit 1
            fi

            bash scripts/release/resolve-version.sh "gtty-v${MANUAL_VERSION#gtty-v}" \
              >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch builds complete installers without creating a GitHub Release."
          else
            echo "Unsupported release event: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi

  source:
    name: Packaging source
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out GTTY
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Nix for source generation
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Generate packaging source
        shell: bash
        env:
          GTTY_VERSION: ${{ needs.policy.outputs.version }}
        run: |
          set -euo pipefail

          nix develop -c zig build dist -Dversion-string="$GTTY_VERSION"

          source_tarball="$(
            find zig-out/dist -maxdepth 1 -type f -name 'ghostty-*.tar.gz' \
              -print -quit
          )"
          test -n "$source_tarball"
          mkdir -p packaging-source
          cp "$source_tarball" packaging-source/
      - name: Upload packaging source
        uses: actions/upload-artifact@v6
        with:
          name: gtty-packaging-source
          path: packaging-source/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux ${{ matrix.arch }}
    needs:
      - policy
      - source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out GTTY
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            dpkg-dev \
            gettext \
            libadwaita-1-dev \
            libgtk-4-dev \
            libxml2-utils \
            meson \
            ninja-build \
            patchelf \
            pkg-config
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Download packaging source
        uses: actions/download-artifact@v8
        with:
          name: gtty-packaging-source
          path: packaging-source
      - name: Extract packaging source
        shell: bash
        run: |
          set -euo pipefail

          source_tarball="$(
            find packaging-source -maxdepth 1 -type f -name 'ghostty-*.tar.gz' \
              -print -quit
          )"
          test -n "$source_tarball"

          source_root="${RUNNER_TEMP}/gtty-packaging-source"
          mkdir -p "$source_root"
          tar -xzf "$source_tarball" -C "$source_root"
          source_dir="$(
            find "$source_root" -mindepth 1 -maxdepth 1 -type d -print -quit
          )"

          test -n "$source_dir"
          test -f "$source_dir/VERSION"
          test ! -e "$source_dir/.git"
          test -f "$source_dir/src/apprt/gtk/ghostty_resources.c"
          test -f "$source_dir/src/apprt/gtk/ghostty_resources.h"
          echo "GTTY_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
      - name: Build private GTK layer shell
        shell: bash
        run: |
          set -euo pipefail

          dependency_url="https://deps.files.ghostty.org/gtk4-layer-shell-1.1.0.tar.gz"
          expected_hash="N-V-__8AALiNBAA-_0gprYr92CjrMj1I5bqNu0TSJOnjFNSr"
          zig_cache="${RUNNER_TEMP}/gtty-zig-dependencies"
          dependency_archive="${RUNNER_TEMP}/gtk4-layer-shell.tar.gz"
          dependency_unpack="${RUNNER_TEMP}/gtk4-layer-shell-source"
          curl --fail --location --retry 3 \
            "$dependency_url" \
            --output "$dependency_archive"
          actual_hash="$(
            zig fetch \
              --global-cache-dir "$zig_cache" \
              "$dependency_archive"
          )"
          if [[ "$actual_hash" != "$expected_hash" ]]; then
            echo "Unexpected gtk4-layer-shell source hash: $actual_hash" >&2
            exit 1
          fi

          mkdir -p "$dependency_unpack"
          tar -xzf "$dependency_archive" -C "$dependency_unpack"
          dependency_source="$(
            find "$dependency_unpack" -mindepth 1 -maxdepth 2 \
              -type f -name meson.build -printf '%h\n' -quit
          )"
          dependency_build="${RUNNER_TEMP}/gtk4-layer-shell-build"
          dependency_prefix="${RUNNER_TEMP}/gtk4-layer-shell-prefix"
          test -n "$dependency_source"
          meson setup \
            "$dependency_build" \
            "$dependency_source" \
            --prefix "$dependency_prefix" \
            -Ddocs=false \
            -Dexamples=false \
            -Dintrospection=false \
            -Dtests=false \
            -Dvapi=false
          meson compile -C "$dependency_build"
          meson install -C "$dependency_build"

          pkgconfig_dir="$(
            find "$dependency_prefix" -type d -name pkgconfig -print -quit
          )"
          private_lib_dir="$(
            find "$dependency_prefix" -type f \
              -name 'libgtk4-layer-shell.so.*' -printf '%h\n' -quit
          )"
          test -n "$pkgconfig_dir"
          test -n "$private_lib_dir"
          echo "GTTY_GTK_PKGCONFIG_DIR=$pkgconfig_dir" >> "$GITHUB_ENV"
          echo "GTTY_GTK_PRIVATE_LIB_DIR=$private_lib_dir" >> "$GITHUB_ENV"
      - name: Build Linux application
        shell: bash
        env:
          GTTY_VERSION: ${{ needs.policy.outputs.version }}
        run: |
          set -euo pipefail

          install_root="${RUNNER_TEMP}/gtty-install-root"
          echo "GTTY_INSTALL_ROOT=$install_root" >> "$GITHUB_ENV"

          (
            cd "$GTTY_SOURCE_DIR"
            PKG_CONFIG_PATH="$GTTY_GTK_PKGCONFIG_DIR" \
              LD_LIBRARY_PATH="$GTTY_GTK_PRIVATE_LIB_DIR" \
              zig build \
                --prefix "$install_root/usr" \
                -Dcpu=baseline \
                -Doptimize=ReleaseFast \
                -Dversion-string="$GTTY_VERSION" \
                -fsys=gtk4-layer-shell
          )
          cargo build --locked --release -p gttyd

          package_lib_dir="$install_root/usr/lib/gtty"
          mkdir -p "$package_lib_dir"
          cp -a "$GTTY_GTK_PRIVATE_LIB_DIR"/libgtk4-layer-shell.so* \
            "$package_lib_dir/"
          patchelf --set-rpath '$ORIGIN/../lib/gtty' \
            "$install_root/usr/bin/ghostty"

          test "$(patchelf --print-rpath "$install_root/usr/bin/ghostty")" \
            = '$ORIGIN/../lib/gtty'
          test -f "$package_lib_dir/libgtk4-layer-shell.so.0"
      - name: Build installable Debian package
        shell: bash
        env:
          GTTY_VERSION: ${{ needs.policy.outputs.version }}
          GTTY_DEB_VERSION: ${{ needs.policy.outputs.deb_version }}
        run: |
          bash scripts/release/package-linux-deb.sh \
            "$GTTY_VERSION" \
            "$GTTY_DEB_VERSION" \
            "${{ matrix.deb_arch }}" \
            "$GTTY_INSTALL_ROOT" \
            target/release/gttyd \
            dist
      - name: Verify Debian installation
        shell: bash
        run: |
          set -euo pipefail

          package="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          package="$(realpath "$package")"

          mv "$GTTY_GTK_PRIVATE_LIB_DIR" "${GTTY_GTK_PRIVATE_LIB_DIR}.hidden"
          sudo apt-get install --yes "$package"
          command -v gtty
          command -v ghostty
          command -v gttyd
          gtty --version
          gttyd --help

          ldd_output="$(ldd /usr/bin/ghostty)"
          echo "$ldd_output"
          if grep -Fq 'not found' <<< "$ldd_output"; then
            echo "The installed GTTY terminal has unresolved shared libraries." >&2
            exit 1
          fi

          layer_shell_path="$(
            awk '$1 == "libgtk4-layer-shell.so.0" { print $3; exit }' \
              <<< "$ldd_output"
          )"
          test -n "$layer_shell_path"
          test "$(realpath "$layer_shell_path")" \
            = "$(realpath /usr/lib/gtty/libgtk4-layer-shell.so.0)"
      - name: Upload Linux installer
        uses: actions/upload-artifact@v6
        with:
          name: gtty-release-linux-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS arm64
    needs: policy
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out GTTY
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Build macOS application
        shell: bash
        env:
          GTTY_VERSION: ${{ needs.policy.outputs.version }}
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Dversion-string="$GTTY_VERSION"
          cargo build --locked --release -p gttyd
      - name: Build installable macOS disk image
        shell: bash
        env:
          GTTY_VERSION: ${{ needs.policy.outputs.version }}
        run: |
          bash scripts/release/package-macos-dmg.sh \
            "$GTTY_VERSION" \
            "arm64" \
            zig-out/Ghostty.app \
            target/release/gttyd \
            dist
      - name: Upload macOS installer
        uses: actions/upload-artifact@v6
        with:
          name: gtty-release-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish unsigned preview
    if: needs.policy.outputs.publish == 'true'
    needs:
      - policy
      - linux
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
      - name: Download verified installers
        uses: actions/download-artifact@v8
        with:
          pattern: gtty-release-*
          path: release-dist
          merge-multiple: true
      - name: Validate release asset set
        shell: bash
        env:
          GTTY_VERSION: ${{ needs.policy.outputs.version }}
        run: |
          bash source/scripts/release/verify-release-assets.sh \
            "$GTTY_VERSION" \
            release-dist
      - name: Generate checksums
        shell: bash
        working-directory: release-dist
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GTTY prerelease
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: GTTY ${{ github.ref_name }} (unsigned preview)
          body: |
            This release contains directly installable, unsigned GTTY preview builds.

            macOS:
            1. On an Apple Silicon Mac (M-series), download the `macOS-arm64` `.dmg`.
            2. Open it and drag `GTTY.app` to `Applications`.
            3. Because this preview is not notarized, use Control-click → Open on first launch.

            Ubuntu 24.04 or compatible Debian-based Linux:
            `sudo apt install ./gtty_${{ needs.policy.outputs.version }}_amd64.deb`
            (use the `arm64` file on ARM machines).

            The package includes the terminal application, the `gtty` command,
            and the `gttyd` local daemon. It replaces an installed `ghostty`
            Debian package because both provide the same terminal resources.
            Verify every download with `SHA256SUMS`.
          files: release-dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
          make_latest: false
